<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPUR — Vancouver Pilot</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0a0a0a; 
            background-image: radial-gradient(circle at 50% 75%, rgba(212, 175, 55, 0.08) 0%, #0a0a0a 60%);
            font-family: 'Inter', sans-serif; 
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gold-text { color: #D4AF37; }
        .gold-btn-3d {
            background: linear-gradient(135deg, #FFF0B3 0%, #D4AF37 45%, #996B00 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), inset 0 -4px 8px rgba(80, 50, 0, 0.8), 0 10px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 240, 179, 0.4);
        }
        .gold-btn-3d:hover { background: linear-gradient(135deg, #FFF6CC 0%, #E5C158 45%, #B38000 100%); }
        @keyframes subtlePulse {
            0% { box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), inset 0 -4px 8px rgba(80, 50, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15); transform: scale(1); }
            50% { box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), inset 0 -4px 8px rgba(80, 50, 0, 0.8), 0 0 45px rgba(212, 175, 55, 0.4); transform: scale(1.02); }
            100% { box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), inset 0 -4px 8px rgba(80, 50, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15); transform: scale(1); }
        }
        .breathe-animation { animation: subtlePulse 3.5s infinite ease-in-out; }
        input[type="tel"] { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(212, 175, 55, 0.3); color: white; text-align: center; }
        input[type="tel"]:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body class="text-zinc-50 min-h-screen flex flex-col selection:bg-[#D4AF37] selection:text-black">
    <div class="flex-grow flex flex-col p-6 max-w-md mx-auto w-full relative">
        <main id="main-content" class="flex-grow flex flex-col justify-center py-4"></main>
    </div>
    <script>
        let storedPhone = localStorage.getItem('spur_client_phone') || null;
        let isEarlySpurtan = localStorage.getItem('spur_early_spurtan') === 'true';
        let currentState = 'idle';

        function render() {
            const main = document.getElementById('main-content');
            const currentPrice = isEarlySpurtan ? '$39.99' : '$49.99';
            const priceLabel = isEarlySpurtan ? 'Early Spurtan Pilot Rate' : 'Pilot Flat Rate';

            if (currentState === 'idle') {
                main.innerHTML = `
                    <div class="space-y-7">
                        <div class="flex justify-between items-start mt-2">
                            <div class="space-y-1">
                                <h1 class="text-3xl font-serif tracking-[0.15em]">SPUR</h1>
                                <p class="gold-text text-[10px] tracking-[0.2em] uppercase">Show up ready&trade;</p>
                            </div>
                            <div class="flex items-center gap-2 bg-zinc-900/90 px-3 py-1.5 rounded-full border border-zinc-800 shadow-lg backdrop-blur-sm">
                                <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                                <span class="text-[9px] text-zinc-300 tracking-wider uppercase">Yaletown: Live</span>
                            </div>
                        </div>

                        <div class="font-serif text-[1.6rem] leading-snug tracking-wide">
                            <p class="text-zinc-100">You don't need to know<br>what will make you<br>look better.</p>
                            <p class="gold-text mt-2">That's what we're here for.</p>
                        </div>

                        <div class="space-y-3.5 pt-1">
                            <div class="flex items-center gap-4">
                                <div class="w-[34px] h-[34px] rounded-full border border-[#D4AF37]/40 flex items-center justify-center shrink-0 bg-[#D4AF37]/5"><svg class="w-3.5 h-3.5 gold-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg></div>
                                <p class="text-zinc-200 text-base font-light tracking-wide">We find your specialist.</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-[34px] h-[34px] rounded-full border border-[#D4AF37]/40 flex items-center justify-center shrink-0 bg-[#D4AF37]/5"><svg class="w-3.5 h-3.5 gold-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg></div>
                                <p class="text-zinc-200 text-base font-light tracking-wide">They know exactly what you need.</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-[34px] h-[34px] rounded-full border border-[#D4AF37]/40 flex items-center justify-center shrink-0 bg-[#D4AF37]/5"><svg class="w-3.5 h-3.5 gold-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg></div>
                                <p class="text-zinc-200 text-base font-light tracking-wide">You approve.</p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-[34px] h-[34px] rounded-full border border-[#D4AF37]/40 flex items-center justify-center shrink-0 bg-[#D4AF37]/5"><svg class="w-3.5 h-3.5 gold-text" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09l2.846.813-2.846.813a4.5 4.5 0 0 0-3.09-3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" /></svg></div>
                                <p class="text-zinc-200 text-base font-light tracking-wide">You get ready.</p>
                            </div>
                        </div>

                        <div class="bg-zinc-900/80 border border-[#D4AF37]/30 rounded-2xl py-3 px-4 text-center backdrop-blur-sm shadow-inner space-y-1">
                            <div class="flex justify-between items-center px-1">
                                <span class="text-zinc-400 text-[11px] tracking-wider uppercase font-medium">${priceLabel}</span>
                                <span class="gold-text font-bold text-base">${currentPrice} CAD</span>
                            </div>
                            <div class="pt-1 border-t border-zinc-800/80 flex justify-between items-center text-[10px] text-zinc-500">
                                <span>Complete grooming & styling</span>
                                <button onclick="toggleSpurtan()" class="gold-text hover:underline cursor-pointer uppercase tracking-wider font-semibold">
                                    ${isEarlySpurtan ? '✓ Early Spurtan Active' : '+ Have Spurtan Code?'}
                                </button>
                            </div>
                        </div>

                        <div class="flex flex-col items-center justify-center pt-1 pb-2 gap-3.5">
                            <button onclick="handleReadyNow()" class="w-[130px] h-[130px] rounded-full gold-btn-3d breathe-animation flex flex-col items-center justify-center transition-all group cursor-pointer">
                                <span class="text-black font-bold tracking-widest text-lg drop-shadow-md group-hover:scale-105 transition-transform">READY</span>
                                <span class="text-black font-bold tracking-widest text-lg drop-shadow-md group-hover:scale-105 transition-transform">NOW&trade;</span>
                            </button>
                            <p class="text-zinc-500 text-[10px] uppercase tracking-widest font-medium">Tap to find match • No payment upfront</p>
                        </div>

                        <div class="text-center pb-2">
                            <p class="gold-text italic font-serif text-[1rem] tracking-wide opacity-90">We look at you, not a menu.</p>
                        </div>
                    </div>
                `;
            } else if (currentState === 'capture_phone') {
                main.innerHTML = `
                    <div class="space-y-8 flex flex-col items-center py-10 h-full justify-center">
                        <div class="text-center space-y-4">
                            <h2 class="text-3xl font-serif tracking-wide">Verify Identity</h2>
                            <p class="text-zinc-400 font-light text-sm max-w-[250px] mx-auto">Enter your mobile number. We will text you your match details.</p>
                        </div>
                        <div class="w-full max-w-[280px] space-y-5">
                            <input type="tel" id="phone-input" placeholder="10 Digits (e.g. 6041234567)" class="w-full py-4 text-xl rounded-xl tracking-wider transition-all" autocomplete="tel"/>
                            <button onclick="submitPhone()" class="w-full gold-btn-3d text-black font-semibold tracking-wider uppercase text-sm py-4 rounded-xl flex justify-center items-center transition cursor-pointer hover:brightness-110 shadow-lg shadow-[#D4AF37]/10">Confirm & Find Match</button>
                        </div>
                        <button onclick="cancelApp()" class="text-zinc-500 text-[10px] uppercase tracking-widest mt-6 hover:text-zinc-300 transition-colors">Cancel</button>
                    </div>
                `;
            } else if (currentState === 'loading') {
                main.innerHTML = `
                    <div class="text-center space-y-8 flex flex-col items-center py-20 h-full justify-center">
                        <div class="w-20 h-20 border-[3px] border-zinc-800 border-t-[#D4AF37] rounded-full animate-spin shadow-lg shadow-[#D4AF37]/5"></div>
                        <div class="space-y-4 font-serif">
                            <h3 class="text-3xl tracking-wide">Locating Specialist</h3>
                            <p class="gold-text italic text-xl opacity-90">Preparing your diagnosis...</p>
                        </div>
                    </div>
                `;
            } else if (currentState === 'matched') {
                main.innerHTML = `
                    <div class="space-y-8 py-6 flex flex-col justify-center min-h-[70vh]">
                        <div class="text-center space-y-3">
                            <span class="inline-block px-4 py-1.5 rounded-full bg-[#D4AF37]/10 gold-text font-medium text-[10px] tracking-[0.2em] border border-[#D4AF37]/30 uppercase shadow-sm">Priority Dispatch</span>
                            <h2 class="text-4xl font-serif tracking-wide">Request<br>Received.</h2>
                            <p class="text-zinc-400 font-light text-base">We are securing your specialist.</p>
                        </div>

                        <div class="bg-zinc-900/60 rounded-3xl p-6 border border-zinc-700/50 space-y-6 relative overflow-hidden backdrop-blur-md shadow-2xl">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-[#FFF0B3] to-[#D4AF37]"></div>
                            
                            <div class="flex items-start justify-between">
                                <div>
                                    <h4 class="text-xl font-serif tracking-wide">Check your messages</h4>
                                    <p class="gold-text text-xs mt-1 uppercase tracking-widest">Updates to: <span class="text-white">${storedPhone}</span></p>
                                </div>
                                <div class="text-right">
                                    <span class="gold-text text-lg font-semibold">${currentPrice}</span>
                                    <p class="text-zinc-500 text-[9px] uppercase tracking-wider">${isEarlySpurtan ? 'Early Spurtan' : 'Pilot Rate'}</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 text-center">
                                <div class="bg-black/60 rounded-2xl p-4 border border-zinc-800/80 flex flex-col justify-center items-center shadow-inner">
                                    <div class="text-2xl font-light tracking-tight"><span class="text-lg opacity-50">&lt;</span> 3</div>
                                    <div class="gold-text text-[9px] uppercase tracking-widest mt-1">Minutes</div>
                                </div>
                                <div class="bg-black/60 rounded-2xl p-4 border border-zinc-800/80 flex flex-col justify-center items-center shadow-inner">
                                    <div class="text-lg font-light tracking-tight">Yaletown</div>
                                    <div class="gold-text text-[9px] uppercase tracking-widest mt-1">Target Area</div>
                                </div>
                            </div>
                            
                            <p class="text-zinc-400 text-xs text-center leading-relaxed font-light">Your concierge is coordinating with our studio partners. You will pay the flat ${currentPrice} fee directly at the studio after your transformation.</p>
                        </div>
                    </div>
                `;
            }
        }

        function toggleSpurtan() {
            if (!isEarlySpurtan) {
                let code = prompt("Enter Early Spurtan Access Code (e.g., SPUR0009):");
                if (!code) return;
                let clean = code.trim().toUpperCase();
                
                let usedCodes = JSON.parse(localStorage.getItem('spur_used_codes') || "[]");
                if (usedCodes.includes(clean)) {
                    alert("❌ This code has already been redeemed on this device.");
                    return;
                }
                
                let isValid = false;
                if (clean.startsWith("SPUR") && clean.length === 8) {
                    let num = parseInt(clean.replace("SPUR", ""));
                    if (!isNaN(num) && num >= 9 && num <= 900 && num % 9 === 0) {
                        isValid = true;
                    }
                }

                if (isValid) {
                    usedCodes.push(clean);
                    localStorage.setItem('spur_used_codes', JSON.stringify(usedCodes));
                    
                    isEarlySpurtan = true;
                    localStorage.setItem('spur_early_spurtan', 'true');
                    alert(`✨ Code ${clean} Accepted! Early Spurtan $39.99 rate unlocked.`);
                    render();
                } else {
                    alert("❌ Invalid Code. Please use a valid unused code (SPUR0009 up to SPUR0900).");
                }
            } else {
                let confirmReset = confirm("Do you want to remove your Early Spurtan status?");
                if (confirmReset) {
                    isEarlySpurtan = false;
                    localStorage.setItem('spur_early_spurtan', 'false');
                    render();
                }
            }
        }

        function handleReadyNow() {
            if (!storedPhone) { currentState = 'capture_phone'; render(); }
            else { proceedToMatch(); }
        }

        function submitPhone() {
            const inputField = document.getElementById('phone-input');
            const phoneClean = inputField.value.replace(/\D/g, '');
            if (phoneClean.length !== 10) {
                alert("🚨 Operation Error:\nPlease enter exactly 10 digits.\nExample: 6041234567");
                inputField.classList.add('border-red-500/50', 'bg-red-950/20');
                return;
            }
            storedPhone = phoneClean;
            localStorage.setItem('spur_client_phone', phoneClean);
            proceedToMatch();
        }

        async function proceedToMatch() {
            currentState = 'loading';
            render();
            try {
                await fetch("https://formspree.io/f/mjykllwj", {
                    method: "POST",
                    headers: { "Accept": "application/json", "Content-Type": "application/json" },
                    body: JSON.stringify({ Alert: "🚨 SPUR CLIENT REQUEST", Client_Phone: storedPhone, Target_Area: "Yaletown", Tier: isEarlySpurtan ? "Early Spurtan ($39.99)" : "Pilot Rate ($49.99)", Time: new Date().toLocaleTimeString() })
                });
            } catch (e) {}
            setTimeout(() => { currentState = 'matched'; render(); }, 2500);
        }

        function cancelApp() { currentState = 'idle'; render(); }
        render();
    </script>
</body>
</html>
